<!-- Inkmap mark: an amber globe with a white place pin. Drawn on a 1024 canvas; the adaptive icon's safe zone is the
     central 66%, so everything stays inside a 330 px radius. The background (#0b1026 to #22306a) is added by scripts/icons.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<g transform="translate(512 512) scale(1.08) translate(-512 -512)">
  <defs>
    <clipPath id="globe"><circle cx="490" cy="534" r="250"/></clipPath>
  </defs>
  <circle cx="490" cy="534" r="250" fill="#f6ad3b"/>
  <g clip-path="url(#globe)" fill="none" stroke="#0b1026" stroke-width="18" stroke-linecap="round">
    <ellipse cx="490" cy="534" rx="105" ry="250"/>
    <line x1="490" y1="270" x2="490" y2="800"/>
    <line x1="230" y1="534" x2="750" y2="534"/>
    <path d="M262 410 Q490 456 718 410"/>
    <path d="M262 658 Q490 612 718 658"/>
  </g>
  <!-- the pin: where you've been -->
  <path d="M676 214c-70 0-126 56-126 126 0 94 126 214 126 214s126-120 126-214c0-70-56-126-126-126z" fill="#ffffff" stroke="#0b1026" stroke-width="22" stroke-linejoin="round"/>
  <circle cx="676" cy="338" r="44" fill="#0b1026"/>
</g>
</svg>
