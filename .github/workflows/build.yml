name: Build

# Every push is tested and built. CI never sees the signing key: the APK here is unsigned, a build check only.
# Signed APKs are built locally with scripts/build-apk.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # version code is the commit count
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK has no network permission and report size
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions "$APK" | grep -q android.permission.INTERNET; then echo "::error::APK declares INTERNET"; exit 1; fi
          ls -l "$APK"
          SIZE=$(stat -c %s "$APK"); echo "APK size: $((SIZE / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          [ "$SIZE" -lt $((80 * 1048576)) ] || { echo "::error::APK over 80 MB"; exit 1; }
          mkdir -p out && cp "$APK" out/Inkmap-unsigned.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'release/*.exe' }
